{
  "name": "openml_diabetes",
  "description": "OpenML diabetes (Pima Indians), dataset ID 37: 768 rows, 8 features, binary target 'class'. Frozen sklearn pipeline; only bounded config.yaml hyperparameters are editable.",
  "dataset": {"source": "openml", "dataset_id": 37, "dataset_name": "diabetes", "target": "class", "licence": "Public"},
  "task": {"type": "binary_classification", "metric": "val_auc", "metric_direction": "maximize", "seed": 42},
  "editable_paths": ["config.yaml"],
  "editable_symbols": ["C", "class_weight", "imputer", "learning_rate", "max_depth", "max_iter", "model_type", "n_estimators", "scaler"],
  "frozen_paths": ["train.py", "benchmark.py", "dataset.json", "README.md", "artifacts/"],
  "branch_state_paths": ["artifacts", "data_cache"],
  "setup_command": null,
  "run_command": "python3 train.py --config config.yaml",
  "metric_name": "val_auc",
  "metric_direction": "maximize",
  "metric_parser": "autoresearch.nodes.openml_credit_g.metric_parser:parse_val_auc",
  "acceptance_rule": "candidate_metric > current_best_metric",
  "validity_checks": ["metric_present", "editable_scope_only", "no_pending_trial"],
  "failure_categories": ["proposal_precondition_failed", "scope_violation", "invalid_patch", "runtime_error", "metric_missing", "artifact_missing", "invalid_config", "noop_patch", "repeated_bad_proposal"],
  "allowed_values": {"model_type": ["logistic_regression", "random_forest", "gradient_boosting"], "class_weight": [null, "balanced"], "scaler": ["none", "standard", "minmax"], "imputer": ["most_frequent", "constant"]},
  "allowed_ranges": {"C": [0.001, 100.0], "max_depth": [2, 30], "n_estimators": [20, 500], "learning_rate": [0.001, 0.5], "max_iter": [100, 3000]},
  "default_budget": {"trials": 10, "max_wall_clock_hours": 0.5},
  "expected_runtime": "~2-10 seconds/trial after OpenML cache warm-up",
  "held_out": false,
  "active_keys": {
    "by_model_type": {
      "logistic_regression": ["model_type", "C", "class_weight", "max_iter", "scaler", "imputer"],
      "random_forest": ["model_type", "n_estimators", "max_depth", "class_weight", "scaler", "imputer"],
      "gradient_boosting": ["model_type", "n_estimators", "max_depth", "learning_rate", "scaler", "imputer"]
    },
    "dataset_excluded": ["imputer"],
    "note": "D25: keys that reach the frozen pipeline under each model_type; computed from the template code. imputer is excluded where the dataset has no categorical columns (features metadata in this repo)."
  }
}
