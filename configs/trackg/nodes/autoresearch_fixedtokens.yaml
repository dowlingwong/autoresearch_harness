# Track G node (trackg_node/v1): autoresearch, fixed-token port.
# Port kit: TRACKG_PORT_CHECKLIST.md (paper repo); harness r1-local-trackg-v2-20261114 @ 717ad835;
# isolated per R1-HARNESS-ISOLATION (harness mac-harness-isolation-20261117).
schema: trackg_node/v1
name: autoresearch_fixedtokens
description: >-
  autoresearch (karpathy/autoresearch via the harness's autoresearch-macos fork, MIT): pretraining of a
  small GPT (depth 4, model width 256, vocabulary 8,192, context 2,048) on climbmix text with Muon and
  AdamW; the metric is validation bits per byte on autoresearch's pinned validation shard (lower is
  better). The editable train.py is the whole training script (model, optimizer, schedules, batch size);
  the frozen files hold the data and tokenizer, the token budget and the metric. train.py runs in a frozen
  worker process; the metric is computed by the frozen parent process, as prepare.evaluate_bpb defines it,
  from model(x) logits the worker returns: train.py must leave a `model` whose call on a token batch x of
  shape (B, T) returns causal logits of shape (B, T, vocab) for every position (not only the last); the
  parent computes the cross-entropy itself, so an edited training loss does not change the metric, and it
  refuses a model that reads later tokens or changes during the evaluation. The fixed budget is 32,768,000 training tokens (500
  optimizer steps of 65,536 tokens) in place of autoresearch's 5-minute wall-clock budget, proposed from an
  estimate of about 1 min of training on an L40S plus compilation and evaluation; the census measures it.
suite: autoresearch
domain: LM

editable_paths:
  - train.py
frozen_paths:
  - run_fixed_budget.py
  - ar_worker.py
  - ar_parent.py
  - ar_isolated.py
  - ar_budget.py
  - ar_data.py
  - prepare.py
  - prepare_data.py
  - requirements.txt
  - LICENCES.md
  - data/
  - representative_edits/
allow_new_files: false

setup_command: 'test -n "$AR_TRACKG_DATA_ROOT" && python3 prepare_data.py --out "$AR_TRACKG_DATA_ROOT/autoresearch_fixedtokens"'
run_command: "PYTORCH_CUDA_ALLOC_CONF=expandable_segments:True python3 run_fixed_budget.py --tokens {budget}"
# R1-HARNESS-ISOLATION: the runner starts the frozen parent directly (no shell); the parent holds the
# result channel and starts ar_worker.py, the only process that imports the editable code.
isolation:
  entry: run_fixed_budget.py
  args: ["--tokens", "{budget}"]
  env:
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  # R1-TRACKG-AR-COND7 option A: the worker hands logits to the parent through the CPU memfd buffer
  # (bind_cpu + SCM_RIGHTS), not CUDA IPC, so the node needs no host /dev/shm: the worker keeps the private one
  # (`shared_dev_shm` stays absent/false, the run record has `exceptions: []` and `effective: true`).
  shared_dev_shm: false

metric_name: val_bpb
metric_direction: minimize
metric:
  metric_regex: '^AR_METRIC val_bpb=(\S+)$'
  loss_regex: '^step \d+ \(.*\) \| loss: (\S+) \|'
  infrastructure_log_patterns:
    # the data check at the start of a run, before AR_DEVICE (data broken before this run: not this run's
    # effect); a run that changes the data fails itself with "AR_ERROR train.py changed the data:" instead
    - '\A(?:(?!AR_DEVICE ).*\n)*?AR_ERROR data '

run_budget:
  kind: tokens
  value: 32768000

workers:
  dataloader_workers: 0
  threads: 4

selection:
  test_scored: false
  selection_split: validation

determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure

external_benchmark:
  name: autoresearch
  repository: https://github.com/karpathy/autoresearch
  fork: https://github.com/miolini/autoresearch-macos (as imported into the harness, nodes/autoresearch-macos)
  license: MIT
  data: karpathy/climbmix-400b-shuffle on Hugging Face (first 10 training shards and validation shard 06542)

notes:
  python_env: torch
  requirements: requirements.txt
  data_location: setup links data/ to $AR_TRACKG_DATA_ROOT/autoresearch_fixedtokens (outside the node)
  dataloader: autoresearch's packing loader in the main process; no worker processes (AR_NUM_WORKERS is logged)
  test_split: none; autoresearch has a validation shard only, so the node is not test-scored
