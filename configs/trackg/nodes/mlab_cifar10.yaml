# Track G node (trackg_node/v1): MLAgentBench cifar10, fixed-step port.
# Port kit: TRACKG_PORT_CHECKLIST.md (paper repo); harness r1-local-trackg-v2-20261114 @ 717ad835.
schema: trackg_node/v1
name: mlab_cifar10
description: >-
  MLAgentBench task cifar10 (benchmarks/cifar10, MIT licence): image classification on CIFAR-10 with the
  suite's small LeNet-style CNN, SGD (lr 0.1, momentum 0.9) and batch size 128. The editable train.py holds
  the model, optimizer, loss and preprocessing; the frozen wrapper holds the data, the split (45,000 train /
  5,000 validation drawn from the training set by the split seed; the suite's 10,000 test images as the
  sealed test set), the training loop and the metric. The fixed budget is 1,950 optimizer steps, the
  length of the suite baseline's own run (5 epochs of 390 batches of 128).
suite: mlagentbench
domain: vision

editable_paths:
  - train.py
frozen_paths:
  - run_fixed_budget.py
  - ar_fixed_loop.py
  - ar_data.py
  - prepare_data.py
  - requirements.txt
  - LICENCES.md
  - data/
  - representative_edits/
allow_new_files: false

setup_command: 'test -n "$AR_TRACKG_DATA_ROOT" && python3 prepare_data.py --out "$AR_TRACKG_DATA_ROOT/mlab_cifar10"'
run_command: "python3 run_fixed_budget.py --steps {budget}"

metric_name: val_accuracy
metric_direction: maximize
metric:
  metric_regex: '^AR_METRIC val_accuracy=(\S+)$'
  loss_regex: '^step \d+ loss (\S+)$'
  steps_regex: '^step (\d+) loss \S+$'
  test_metric_regex: '^AR_TEST test_accuracy=(\S+)$'
  infrastructure_log_patterns:
    # the wrapper's GPU check, printed before the editable code is imported (no AR_DEVICE line before it)
    - '\A(?:(?!AR_DEVICE ).*\n)*?AR_INFRA a GPU was assigned \(CUDA_VISIBLE_DEVICES set\) but CUDA is unavailable$'

run_budget:
  kind: steps
  value: 1950

workers:
  dataloader_workers: 0
  threads: 4

selection:
  test_scored: true
  selection_split: validation
  test_metric_name: test_accuracy

determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure

external_benchmark:
  name: MLAgentBench
  repository: https://github.com/snap-stanford/MLAgentBench
  task: benchmarks/cifar10
  license: MIT
  data: CIFAR-10 (torchvision download; Krizhevsky 2009)

notes:
  python_env: torch
  requirements: requirements.txt
  data_location: setup links data/ to $AR_TRACKG_DATA_ROOT/mlab_cifar10 (outside the node)
  dataloader: data live in device memory; no loader worker processes (AR_NUM_WORKERS is read and logged)
