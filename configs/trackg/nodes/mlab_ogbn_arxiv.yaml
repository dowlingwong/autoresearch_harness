# Track G node (trackg_node/v1): MLAgentBench ogbn-arxiv, fixed-step port.
# Port kit: TRACKG_PORT_CHECKLIST.md (paper repo); harness r1-local-trackg-v2-20261114 @ 717ad835.
schema: trackg_node/v1
name: mlab_ogbn_arxiv
description: >-
  MLAgentBench task ogbn-arxiv (benchmarks/ogbn-arxiv, MIT licence): 40-class node classification of arXiv
  papers with the suite's baseline, a 2-layer MLP on node features (hidden 16, batch norm, Adam lr 1,
  batches of 1,024 training nodes). The editable train.py holds model, optimizer and loss and receives the
  full features and edge list; the frozen wrapper holds the data, the official split (train / valid / test
  by year; valid is the selection split, test the sealed test set), the training loop and the metric. The
  fixed budget is 356 optimizer steps, the length of the suite baseline's own run (4 epochs of 89 batches).
suite: mlagentbench
domain: graph

editable_paths:
  - train.py
frozen_paths:
  - run_fixed_budget.py
  - ar_fixed_loop.py
  - ar_data.py
  - prepare_data.py
  - requirements.txt
  - NOTICE.md
  - data/
  - representative_edits/
allow_new_files: false

setup_command: 'python3 prepare_data.py --out "$AR_TRACKG_DATA_ROOT/mlab_ogbn_arxiv"'
run_command: "python3 run_fixed_budget.py --steps {budget}"

metric_name: val_accuracy
metric_direction: maximize
metric:
  metric_regex: '^AR_METRIC val_accuracy=(\S+)$'
  loss_regex: '^step \d+ loss (\S+)$'
  steps_regex: '^step (\d+) loss \S+$'
  test_metric_regex: '^AR_TEST test_accuracy=(\S+)$'
  infrastructure_log_patterns: []

run_budget:
  kind: steps
  value: 356

workers:
  dataloader_workers: 0
  threads: 4

selection:
  test_scored: true
  selection_split: validation
  test_metric_name: test_accuracy

determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure

external_benchmark:
  name: MLAgentBench
  repository: https://github.com/snap-stanford/MLAgentBench
  task: benchmarks/ogbn-arxiv
  license: MIT
  data: ogbn-arxiv (Open Graph Benchmark; MAG-derived, ODC-BY), fetched with the ogb package

notes:
  python_env: torch
  requirements: requirements.txt
  data_location: setup links data/ to $AR_TRACKG_DATA_ROOT/mlab_ogbn_arxiv (outside the node)
  dataloader: data live in device memory; no loader worker processes (AR_NUM_WORKERS is read and logged)
