# Track G node (trackg_node/v1): MLGym imageClassificationFMnist, fixed-step port.
# Port kit: TRACKG_PORT_CHECKLIST.md (paper repo); harness r1-local-trackg-v2-20261114 @ 717ad835.
schema: trackg_node/v1
name: mlgym_fmnist
description: >-
  MLGym task imageClassificationFMnist (CC BY-NC 4.0): image classification on Fashion-MNIST with the
  suite's baseline, a two-layer CNN trained with the Hugging Face Trainer defaults (AdamW lr 5e-5, 500
  warmup steps, linear decay, clip 1.0, batch 64), written out in train.py. The editable train.py holds
  model, optimizer, schedule, loss and preprocessing; the frozen wrapper holds the data, the split (54,000
  train / 6,000 validation drawn from the training set by the split seed; the suite's 10,000 test images as
  the sealed test set), the training loop and the metric. The fixed budget is 9,380 optimizer steps, the
  length of the suite baseline's own run (10 epochs of 938 batches of 64).
suite: mlgym
domain: vision

editable_paths:
  - train.py
frozen_paths:
  - run_fixed_budget.py
  - ar_fixed_loop.py
  - ar_data.py
  - prepare_data.py
  - requirements.txt
  - LICENCES.md
  - data/
  - representative_edits/
allow_new_files: false

setup_command: 'test -n "$AR_TRACKG_DATA_ROOT" && python3 prepare_data.py --out "$AR_TRACKG_DATA_ROOT/mlgym_fmnist"'
run_command: "python3 run_fixed_budget.py --steps {budget}"

metric_name: val_accuracy
metric_direction: maximize
metric:
  metric_regex: '^AR_METRIC val_accuracy=(\S+)$'
  loss_regex: '^step \d+ loss (\S+)$'
  steps_regex: '^step (\d+) loss \S+$'
  test_metric_regex: '^AR_TEST test_accuracy=(\S+)$'
  infrastructure_log_patterns:
    # the wrapper's GPU check, printed before the editable code is imported (no AR_DEVICE line before it)
    - '\A(?:(?!AR_DEVICE ).*\n)*?AR_INFRA a GPU was assigned \(CUDA_VISIBLE_DEVICES set\) but CUDA is unavailable$'

run_budget:
  kind: steps
  value: 9380

workers:
  dataloader_workers: 0
  threads: 4

selection:
  test_scored: true
  selection_split: validation
  test_metric_name: test_accuracy

determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure

external_benchmark:
  name: MLGym
  repository: https://github.com/facebookresearch/MLGym
  commit: 9d40c1b5035202018cd7091fb4e83a9c68b377c0
  task: imageClassificationFMnist
  license: CC-BY-NC-4.0 (non-commercial; attribution and changes in LICENCES.md)
  data: Fashion-MNIST (MIT), Hugging Face dataset zalando-datasets/fashion_mnist (revision recorded in the data manifest)

notes:
  python_env: torch
  requirements: requirements.txt
  data_location: setup links data/ to $AR_TRACKG_DATA_ROOT/mlgym_fmnist (outside the node)
  dataloader: data live in device memory; no loader worker processes (AR_NUM_WORKERS is read and logged)
