# Track G node (trackg_node/v1): MLAgentBench imdb, fixed-step port.
# Port kit: TRACKG_PORT_CHECKLIST.md (paper repo); harness r1-local-trackg-v2-20261114 @ 717ad835.
schema: trackg_node/v1
name: mlab_imdb
description: >-
  MLAgentBench task imdb (benchmarks/imdb, MIT licence): binary sentiment classification of IMDb reviews by
  fine-tuning distilbert-base-uncased. The suite ships only a skeleton, so the baseline in train.py is the
  port's (fresh 2-class head, 256 tokens, AdamW lr 2e-5 with linear decay, clip 1.0, bf16 autocast, batch
  16). The editable train.py holds model, optimizer, loss and input truncation; the frozen wrapper holds the
  tokenized data (512 tokens), the split (22,500 train / 2,500 validation drawn from the training reviews by
  the split seed; the suite's 25,000 test reviews as the sealed test set), the training loop and the metric.
  The fixed budget is 1,000 optimizer steps (16,000 reviews at batch 16, about 0.7 epoch), proposed from an
  estimate of about 1 min of training on an L40S; the census measures it.
suite: mlagentbench
domain: text

editable_paths:
  - train.py
frozen_paths:
  - run_fixed_budget.py
  - ar_fixed_loop.py
  - ar_data.py
  - prepare_data.py
  - requirements.txt
  - NOTICE.md
  - data/
  - representative_edits/
allow_new_files: false

setup_command: 'python3 prepare_data.py --out "$AR_TRACKG_DATA_ROOT/mlab_imdb"'
run_command: "python3 run_fixed_budget.py --steps {budget}"

metric_name: val_accuracy
metric_direction: maximize
metric:
  metric_regex: '^AR_METRIC val_accuracy=(\S+)$'
  loss_regex: '^step \d+ loss (\S+)$'
  steps_regex: '^step (\d+) loss \S+$'
  test_metric_regex: '^AR_TEST test_accuracy=(\S+)$'
  infrastructure_log_patterns: []

run_budget:
  kind: steps
  value: 1000

workers:
  dataloader_workers: 0
  threads: 4

selection:
  test_scored: true
  selection_split: validation
  test_metric_name: test_accuracy

determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure

external_benchmark:
  name: MLAgentBench
  repository: https://github.com/snap-stanford/MLAgentBench
  task: benchmarks/imdb
  license: MIT
  data: IMDb reviews (Maas et al. 2011), Hugging Face dataset stanfordnlp/imdb
  pretrained_model: distilbert-base-uncased (Apache-2.0), hub revision recorded in the data manifest

notes:
  python_env: torch
  requirements: requirements.txt
  data_location: setup links data/ to $AR_TRACKG_DATA_ROOT/mlab_imdb (outside the node)
  dataloader: data live in device memory; no loader worker processes (AR_NUM_WORKERS is read and logged)
