# Track G node (trackg_node/v1): MLGym regressionKaggleHousePrice, one-fit port.
# Port kit: TRACKG_PORT_CHECKLIST.md (paper repo); harness r1-local-trackg-v2-20261114 @ 717ad835.
schema: trackg_node/v1
name: mlgym_houseprice
description: >-
  MLGym task regressionKaggleHousePrice (CC BY-NC 4.0): sale-price regression on MLGym's copy of the Kaggle
  House Prices table (1,460 rows) with the suite's baseline (imputation, scaling, one-hot encoding, Ridge
  alpha 0.1). The editable train.py returns an unfitted estimator and may transform the target; the frozen
  wrapper holds the data, MLGym's split (fixed 20 % test as the sealed test set; 12.5 % of the rest as
  validation, drawn by the split seed, seed 42 reproducing MLGym's files), the single fit and the metric
  (RMSE on the price scale). The budget is one fit (steps 1): the task has no training steps, so the budget
  does not bound an edit's compute; the port report raises this for the author.
suite: mlgym
domain: tabular

editable_paths:
  - train.py
frozen_paths:
  - run_fixed_budget.py
  - ar_data.py
  - prepare_data.py
  - requirements.txt
  - NOTICE.md
  - data/
  - representative_edits/
allow_new_files: false

setup_command: 'python3 prepare_data.py --out "$AR_TRACKG_DATA_ROOT/mlgym_houseprice"'
run_command: "python3 run_fixed_budget.py --steps {budget}"

metric_name: val_rmse
metric_direction: minimize
metric:
  metric_regex: '^AR_METRIC val_rmse=(\S+)$'
  loss_regex: '^step \d+ loss (\S+)$'
  steps_regex: '^step (\d+) loss \S+$'
  test_metric_regex: '^AR_TEST test_rmse=(\S+)$'
  infrastructure_log_patterns: []

run_budget:
  kind: steps
  value: 1

workers:
  dataloader_workers: 0
  threads: 4

selection:
  test_scored: true
  selection_split: validation
  test_metric_name: test_rmse

determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure

external_benchmark:
  name: MLGym
  repository: https://github.com/facebookresearch/MLGym
  commit: 9d40c1b5035202018cd7091fb4e83a9c68b377c0
  task: regressionKaggleHousePrice
  license: CC-BY-NC-4.0 (non-commercial; attribution and changes in NOTICE.md)
  data: Kaggle House Prices training table as shipped in MLGym (data/regressionKaggleHousePrice/_helpers/train.csv, sha256 pinned in prepare_data.py)

notes:
  python_env: torch (scikit-learn and pandas only; no GPU use)
  requirements: requirements.txt
  data_location: setup links data/ to $AR_TRACKG_DATA_ROOT/mlgym_houseprice (outside the node)
  budget_semantics: one fit call; not a compute bound (see the port report)
