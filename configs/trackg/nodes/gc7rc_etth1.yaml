# Track G node (trackg_node/v1): 1GC-7RC Task 6, ETTh1 96-step forecasting, isolated fixed-step port.
# Port kit: TRACKG_PORT_CHECKLIST.md (paper repo, section F for licence/provenance); harness
# mac-trackg-t1-tasl-20261121 @ c025f89a (accepted T1 TASL harness; base of this branch); isolated per
# R1-HARNESS-ISOLATION (core mac-harness-isolation-20261117 @ 68cdd1a + fix mac-harness-isolation-fix-20261119
# @ 5403392e, both merged in the base).
schema: trackg_node/v1
name: gc7rc_etth1
description: >-
  1GC-7RC Task 6 (public ETTh1 dataset; the 1GC-7RC suite repository itself is not public, so the port follows
  the paper's stated public dataset/task semantics, not suite code): multivariate 96-step-ahead forecasting on
  ETTh1 (hourly electricity-transformer temperatures, 7 features, 17,420 rows) given 336 historical steps, with
  the standard LTSF 12/4/4-month split (8,640 / 2,880 / 2,880 rows), train-set standardisation and MSE. The
  editable train.py holds the DLinear baseline (moving-average decomposition, kernel 25, two linear
  projections), its optimizer and loss; the frozen parent and worker hold the data, the split, the windowing,
  the fixed-step loop and the metric (validation MSE selected on; test MSE sealed). The fixed budget is 2,000
  optimizer steps at batch size 128, a short fixed-step stand-in for the paper's 40-minute agent budget
  (R1-BX-D5); the port measured the baseline chain on the CPU and the census measures it on the GPU.
suite: 1gc7rc
domain: time series

editable_paths:
  - train.py
frozen_paths:
  - run_fixed_budget.py
  - ar_worker.py
  - ar_parent.py
  - ar_isolated.py
  - ar_fixed_loop.py
  - ar_data.py
  - prepare_data.py
  - requirements.txt
  - LICENCES.md
  - README.md
  - data/
  - representative_edits/
allow_new_files: false

setup_command: 'test -n "$AR_TRACKG_DATA_ROOT" && python3 prepare_data.py --out "$AR_TRACKG_DATA_ROOT/gc7rc_etth1"'
run_command: "python3 run_fixed_budget.py --steps {budget}"
# R1-HARNESS-ISOLATION: the runner starts the frozen parent directly (no shell); the parent holds the
# result channel and starts ar_worker.py, the only process that imports the editable code.
isolation:
  entry: run_fixed_budget.py
  args: ["--steps", "{budget}"]

metric_name: val_mse
metric_direction: minimize
metric:
  metric_regex: '^AR_METRIC val_mse=(\S+)$'
  loss_regex: '^step \d+ loss (\S+)$'
  steps_regex: '^step (\d+) loss \S+$'
  test_metric_regex: '^AR_TEST test_mse=(\S+)$'
  infrastructure_log_patterns:
    # the worker's GPU check, printed before the editable code is imported (no AR_DEVICE line before it)
    - '\A(?:(?!AR_DEVICE ).*\n)*?AR_INFRA a GPU was assigned \(CUDA_VISIBLE_DEVICES set\) but CUDA is unavailable$'

run_budget:
  kind: steps
  value: 2000

workers:
  dataloader_workers: 0
  threads: 4

selection:
  test_scored: true
  selection_split: validation
  test_metric_name: test_mse

determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure

external_benchmark:
  name: 1GC-7RC (public datasets; not a suite, R1-1GC-FALLBACK)
  paper: 'arXiv:2605.17046v2, Task 6'
  repository: https://github.com/zhouhaoyi/ETDataset (the public dataset; the paper-named suite repository returned 404, U1 audit)
  commit: 1d16c8f4f943005d613b5bc962e9eeb06058cf07
  task: ETTh1, 336 -> 96 multivariate forecasting, MSE
  license: dataset CC BY-ND 4.0 (the most restrictive of three conflicting claims; data downloaded, never redistributed; see LICENCES.md)
  data: ETTh1.csv from the pinned ETDataset commit, sha256 f18de3ad269cef59bb07b5438d79bb3042d3be49bdeecf01c1cd6d29695ee066

notes:
  python_env: torch (baseline is DLinear; CPU smoke runs and U2 census on the GPU)
  requirements: requirements.txt
  data_location: setup links data/ to $AR_TRACKG_DATA_ROOT/gc7rc_etth1 (outside the node); the raw CSV is setup-only
  budget_semantics: 2,000 optimizer steps at batch 128 (about 31 epochs of the 8,209 training windows); fixed before the census
  split: chronological 12/4/4 months (LTSF); the split seed is recorded but does not change the split
  suite_status: 1GC-7RC is not a suite (R1-1GC-FALLBACK); this is the candidate-2 extra task of R1-T1-NODE-EXPANSION
