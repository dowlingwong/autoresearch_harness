# Track G node template (trackg_node/v1), M10 step 0.
# Copy this file per ported task (HoreKa agent, G.1) and fill every field.
# Loader: autoresearch.trackg.node_template.load_trackg_node_spec (strict:
# unknown keys are refused; any wall-clock budget key is refused, R1-BX-D5).
schema: trackg_node/v1
name: example_task                      # unique node name
description: >-
  One paragraph: suite, task, data, what the baseline script does, and what the
  fixed budget means for this task.
suite: mlgym                            # autoresearch | mlgym | mlagentbench | ...
domain: vision                          # LM | vision | graph | tabular | time series | text | RL

# Scope. A diff may touch only editable_paths; frozen_paths (evaluator, data
# loader, metric code, data) are refused even if an editable entry covers them.
editable_paths:
  - train.py
frozen_paths:
  - evaluate.py
  - data/
  - prepare.py
  - run_fixed_budget.py                 # the fixed-step wrapper is frozen too

# A frozen script must not live in an editable directory (a new file there
# could shadow its imports). New files are refused unless this is true; even
# then new modules named like importable modules are refused.
allow_new_files: false

setup_command: ""                       # run once per host, not per run
# {budget} is replaced by run_budget.value; the wrapper also gets
# AR_BUDGET_KIND / AR_BUDGET_VALUE, AR_TRAIN_SEED / AR_SPLIT_SEED,
# AR_NUM_THREADS and AR_NUM_WORKERS in its environment.
run_command: "python3 run_fixed_budget.py --steps {budget}"

metric_name: val_accuracy               # the SELECTION metric (validation split)
metric_direction: maximize              # maximize | minimize
metric:
  metric_regex: '^val_accuracy:\s*(\S+)'          # one capture group; last match counts; ANCHOR it
                                                  # (best: a frozen-wrapper prefix such as '^AR_METRIC val_accuracy=(\S+)')
  loss_regex: '^step\s+\d+\s+loss:\s*(\S+)'       # REQUIRED; any non-finite match -> divergent
  steps_regex: '^step\s+(\d+)\b'                  # optional: budget must be reached
  test_metric_regex: '^test_accuracy:\s*(\S+)'    # test-scored tasks only; sealed, never selected on
  infrastructure_log_patterns: []                 # extra patterns that mean infrastructure_failure

# Fixed budget: kind steps or tokens, a positive integer. Never wall-clock:
# keys naming a time quantity (anywhere, also under notes) and run commands
# with time flags (--time-budget, --timeout, --max-time, TIME_BUDGET=...) are refused.
run_budget:
  kind: steps
  value: 2000

# Fixed counts (never 'auto'): exported as OMP/MKL/OPENBLAS/NUMEXPR threads,
# torch.set_num_threads, and AR_NUM_WORKERS for the data loader.
workers:
  dataloader_workers: 2
  threads: 4

# Test-scored tasks select on validation only (R1-TRACKG-ROLE).
selection:
  test_scored: true
  selection_split: validation
  test_metric_name: test_accuracy

# Deterministic settings (the runner records any that could not be forced).
determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false        # true only if the census shows the baseline needs it

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20                            # campaign length in trials; no wall-clock cap

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure
