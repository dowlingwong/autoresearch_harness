# Track G node (trackg_node/v1): MLGym rlMetaMazeMisc, fixed-step port.
# Port kit: TRACKG_PORT_CHECKLIST.md (paper repo, section F for licence/provenance); harness
# mac-trackg-t1-tasl-20261121 @ c025f89a (accepted T1 TASL harness; base of this branch); isolated per
# R1-HARNESS-ISOLATION (core mac-harness-isolation-20261117 @ 68cdd1a + fix mac-harness-isolation-fix-20261119
# @ 5403392e, both merged in the base).
#
# R1-T1-NODE-EXPANSION candidate 3 is "MLGym MountainCarContinuous or MetaMaze".  MountainCarContinuous was
# checked and rejected for a noise floor (see the node's README.md §1 and LICENCES.md): an episode that reaches
# the goal ends with the single +100 goal reward (return ~+95), an episode that does not is truncated with a
# negative action penalty (return ~-20 to -200); there is no partial credit, so the aggregate metric is a
# transform of the solved fraction, and at the fixed 1-2 min-class budget the policy stays wholly in the
# unsolved mode (empirical probe: 2,000,000 env steps, per-episode returns -25..-217, mean -160, no episode
# solved).  The U3 port report (17 Nov 2026) had already recorded "MountainCarContinuous tends to end solved or
# not solved, a poor fit for a noise floor".  MetaMaze's return is a graded count of goals reached (the goal
# moves on each success and the episode continues; +10 per goal over 199 frames), so partial progress is
# measurable; the port therefore ports rlMetaMazeMisc.
schema: trackg_node/v1
name: mlgym_metamaze
description: >-
  MLGym task rlMetaMazeMisc (CC BY-NC 4.0; PPO adapted from gymnax-blines): reinforcement learning on the
  gymnax MetaMaze-misc grid world with the suite's PPO (frozen policy.py), its actor-critic network (editable
  networks.py) and its hyperparameters (editable config.yaml). One model per run, trained from the training
  seed as MLGym's first checkpoint; the frozen parent evaluates it with MLGym's rollout (256 environments,
  199 frames, +10 per goal reached with the goal re-drawn on each success): validation keys from the split
  seed for selection, MLGym's test keys 0-4 for the sealed test return. The fixed budget is 2,000,000
  environment steps (MLGym's default is 10,000,000 for each of five checkpoints), proposed from a CPU
  measurement of 51 s of training for the baseline at this budget on four cores (1-2 min on the TASL RTX 4090
  is expected; the census measures it). The metric is a graded goal count, not a solved/not-solved indicator:
  the same CPU probe at the budget gave a graded validation return (mean 8.1, standard deviation 12.3, range
  0-50) with headroom to MLGym's published baseline (mean 15.7).
suite: mlgym
domain: RL

editable_paths:
  - config.yaml
  - networks.py
frozen_paths:
  - run_fixed_budget.py
  - ar_worker.py
  - ar_parent.py
  - ar_isolated.py
  - ar_data.py
  - policy.py
  - helpers.py
  - evaluate_policy.py
  - prepare_data.py
  - requirements.txt
  - requirements_gpu.txt
  - LICENCES.md
  - README.md
  - data/
  - representative_edits/
allow_new_files: false

setup_command: 'test -n "$AR_TRACKG_DATA_ROOT" && python3 prepare_data.py --out "$AR_TRACKG_DATA_ROOT/mlgym_metamaze"'
run_command: "python3 run_fixed_budget.py --steps {budget}"
# R1-HARNESS-ISOLATION: the runner starts the frozen parent directly (no shell); the parent holds the
# result channel and starts ar_worker.py, the only process that imports the editable code.
isolation:
  entry: run_fixed_budget.py
  args: ["--steps", "{budget}"]

metric_name: val_return
metric_direction: maximize
metric:
  metric_regex: '^AR_METRIC val_return=(\S+)$'
  loss_regex: '^step \d+ loss (\S+)$'
  steps_regex: '^AR_STEPS env_steps=(\d+)$'
  test_metric_regex: '^AR_TEST test_return=(\S+)$'
  infrastructure_log_patterns:
    # the worker's GPU check, printed before the editable code is imported (no AR_DEVICE line before it)
    - '\A(?:(?!AR_DEVICE ).*\n)*?AR_INFRA a GPU was assigned \(CUDA_VISIBLE_DEVICES set\) but CUDA is unavailable$'

run_budget:
  kind: steps
  value: 2000000

workers:
  dataloader_workers: 0
  threads: 4

selection:
  test_scored: true
  selection_split: validation
  test_metric_name: test_return

determinism:
  cudnn_benchmark: false
  deterministic_algorithms: true
  cublas_workspace_config: ":4096:8"
  pythonhashseed: "0"
  deterministic_warn_only: false

seed_env:
  train: AR_TRAIN_SEED
  split: AR_SPLIT_SEED

default_budget:
  trials: 20

failure_categories:
  - syntax_error
  - runtime_error
  - metric_missing
  - invalid_edit_scope
  - divergent
  - infrastructure_failure

external_benchmark:
  name: MLGym
  repository: https://github.com/facebookresearch/MLGym
  commit: 9d40c1b5035202018cd7091fb4e83a9c68b377c0
  task: rlMetaMazeMisc (gymnax MetaMaze-misc)
  license: CC-BY-NC-4.0 (non-commercial; attribution and changes in LICENCES.md)
  data: none (the environment is simulated by gymnax); setup downloads the pinned MLGym task/package snapshot and hashes it

notes:
  python_env: jax (separate environment from the torch nodes; see requirements.txt)
  requirements: requirements.txt (local CPU check); requirements_gpu.txt on the GPU host
  jax_settings: the worker sets XLA_FLAGS --xla_gpu_deterministic_ops=true, XLA_PYTHON_CLIENT_PREALLOCATE=false and TF_CUDNN_DETERMINISTIC=1 before importing jax
  determinism_shim: the torch shim has nothing to force here. In the torch-free JAX environment the run record's not_forced is cudnn.benchmark=False, dataloader_workers, torch.set_num_threads and torch.use_deterministic_algorithms(True) (reason torch_absent); XLA CPU threads are not bounded by the shim
  suite_status: MLGym rlMetaMazeMisc is candidate 3 of R1-T1-NODE-EXPANSION (the row names "MLGym MountainCarContinuous or MetaMaze"); MountainCarContinuous was rejected for a noise floor (see the top comment), MetaMaze is this node
